<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080c10">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}EverDrive{% endblock %}</title>
  <link rel="icon" href="/static/icon.png" type="image/png">
  <link rel="stylesheet" href="/static/drive.css">
  <script src="/static/common.js" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body data-owner="{{ request.user.is_authenticated|yesno:'true,false' }}" {% block body_attrs %}{% endblock %}>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-drive" viewBox="0 0 24 24"><path d="m8 3 5 9-5 9H2l5-9-5-9Z"/><path d="m8 3 6 0 8 15-3 3H8M13 12h6M8 21l5-9"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Zm0 0v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4m-6 6-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m0 4 1-1a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-storage" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 13h18M7 17h.01M11 17h.01"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H4v16h5M10 12h11m-4-4 4 4-4 4"/></symbol>
  </svg>
  <header class="topbar">
    <a class="brand" href="{% if request.user.is_authenticated %}/{% else %}/login/{% endif %}" aria-label="EverDrive">
      <img src="/static/logo-icon.png" alt="" width="34" height="34">
      <span><b>EVERDRIVE</b><small>EVERBRIGHT</small></span>
    </a>
    <div class="capacity-top" data-testid="storage-available" role="status" aria-live="polite"><span class="status-dot"></span><span data-capacity>Calcolo spazio EverDrive…</span></div>
    <div class="top-actions">
      <a class="quiet-link services-link" href="https://servizi.everbright.it" target="_blank" rel="noopener noreferrer">Servizi</a>
      {% if request.user.is_authenticated %}
      <form action="/logout/" method="post">{% csrf_token %}<button class="icon-button" title="Esci" aria-label="Esci"><svg><use href="#i-logout"/></svg></button></form>
      <span class="avatar" title="{{ request.user.email }}" aria-label="Account {{ request.user.email }}">A</span>
      {% else %}<span class="private-label"><svg><use href="#i-lock"/></svg> Spazio personale</span>{% endif %}
    </div>
  </header>
  {% block content %}{% endblock %}
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
