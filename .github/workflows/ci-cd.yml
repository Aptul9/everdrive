name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tests and containers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIVE_DATA_DIR: /tmp/drive-ci-data
      DRIVE_ALLOWED_HOSTS: localhost,testserver
      DRIVE_INSECURE_LOCAL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Isolated test credentials
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name in ('DJANGO_SECRET_KEY', 'TEST_OWNER_PASSWORD'):
                  value = secrets.token_urlsafe(48)
                  print('::add-mask::' + value)
                  output.write(name + '=' + value + '\n')
          PY
      - name: Django and storage tests
        run: |
          mkdir -p "$DRIVE_DATA_DIR"
          python manage.py makemigrations --check --dry-run
          python manage.py test storage --verbosity 1
          DRIVE_INSECURE_LOCAL=0 python manage.py check --deploy --fail-level WARNING
          python -m unittest discover -s ci -p 'test_*.py'
      - name: Build and validate production containers
        run: |
          docker build -t everbright-drive:ci .
          docker build -f Dockerfile.caddy -t everbright-drive-web:ci .
          docker run --rm -e DOMAIN=drive.example.com everbright-drive-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose config --quiet
          # A sparse tmpfs fixture advertises enough capacity for the real 20 GB reserve.
          # Only the test payload is allocated; production disk checks remain unchanged.
          volume="drive-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create --driver local --opt type=tmpfs --opt device=tmpfs --opt o=size=24g,uid=10001,gid=10001,mode=0700 "$volume"
          cleanup() {
            for item in "${container:-}" "${cleaner:-}"; do
              if test -n "$item"; then docker rm -f "$item" >/dev/null; fi
            done
            docker volume rm "$volume" >/dev/null
          }
          trap cleanup EXIT
          options=(--cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp -e DJANGO_SECRET_KEY -e DRIVE_INSECURE_LOCAL=1 -e DRIVE_ALLOWED_HOSTS=localhost -e DRIVE_QUOTA_BYTES=67108864 -e DRIVE_ANONYMOUS_TTL_SECONDS=60 -v "$volume:/data")
          # Keep tmpfs mounted across one-off migration and bootstrap containers.
          container=$(docker run -d "${options[@]}" -p 127.0.0.1:8791:8000 everbright-drive:ci)
          docker run --rm "${options[@]}" everbright-drive:ci python manage.py migrate --noinput
          docker run --rm "${options[@]}" everbright-drive:ci python manage.py check
          printf '%s\n' "$TEST_OWNER_PASSWORD" | docker run --rm -i "${options[@]}" everbright-drive:ci python manage.py bootstrap_owner
          cleaner=$(docker run -d "${options[@]}" everbright-drive:ci python manage.py cleanup --loop)
          session=$(docker exec "$container" python manage.py shell -c 'from django.test import Client; from django.contrib.auth import get_user_model; from django.conf import settings; c=Client(); c.force_login(get_user_model().objects.get(username=settings.OWNER_EMAIL), backend="storage.auth.EverIDBackend"); print(c.session.session_key)' | tail -1)
          test -n "$session"
          echo "::add-mask::$session"
          printf '%s\n' "$session" | python ci/smoke.py --url http://localhost:8791
          printf '%s\n' "$session" | python ci/expiry_smoke.py --url http://localhost:8791 --data-dir /data --container "$container"
          logs=$(docker logs "$container" 2>&1)
          if grep -E '\[ERROR\]|Traceback' <<< "$logs"; then
            echo 'Production container emitted runtime errors' >&2
            exit 1
          fi
          bash -n ci/deploy.sh ci/rollback.sh

  deploy:
    name: Deploy
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://drive.everbright.it
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: SSH configuration
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Prepare release and runtime inputs
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          LEGACY_LOGIN: ${{ vars.LEGACY_LOGIN || '1' }}
        run: |
          test -n "$DJANGO_SECRET_KEY" && test -n "$OWNER_PASSWORD"
          # EverID is mandatory from this release on; a missing client must stop the deploy.
          [[ "$OIDC_CLIENT_ID" =~ ^[A-Za-z0-9._~-]+$ && "$OIDC_CLIENT_SECRET" =~ ^[A-Za-z0-9._~-]+$ ]]
          [[ "$OIDC_ISSUER" =~ ^https://[a-z0-9.-]+/application/o/[a-z0-9-]+/$ ]]
          [[ "$LEGACY_LOGIN" =~ ^[01]$ ]]
          umask 077
          git archive --format=tar.gz HEAD > release.tar.gz
          printf 'DJANGO_SECRET_KEY=%s\n' "$DJANGO_SECRET_KEY" > environment.new
          printf 'OIDC_ISSUER=%s\nOIDC_CLIENT_ID=%s\nOIDC_CLIENT_SECRET=%s\nLEGACY_LOGIN=%s\n' \
            "$OIDC_ISSUER" "$OIDC_CLIENT_ID" "$OIDC_CLIENT_SECRET" "$LEGACY_LOGIN" > oidc.env.new
          printf '%s\n' "$OWNER_PASSWORD" > owner-password.new
          ssh "$TARGET" 'install -d -m 700 /opt/everbright-drive'
          scp release.tar.gz environment.new oidc.env.new owner-password.new "$TARGET:/opt/everbright-drive/"
      - name: Deploy from versioned script
        run: ssh "$TARGET" "set -e; tar xzf /opt/everbright-drive/release.tar.gz -C /opt/everbright-drive ci/deploy.sh; bash /opt/everbright-drive/ci/deploy.sh '$GITHUB_SHA'"
      - name: Public application checks
        run: |
          curl --fail --silent --show-error https://drive.everbright.it/healthz/ | grep -q '"status": "ok"'
          curl --fail --silent --show-error https://drive.everbright.it/anonymous/ | grep -q 'Condivisioni'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://drive.everbright.it/api/files/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' https://drive.everbright.it/login/)" = 302
          origin=$(cut -d/ -f1-3 <<< "${{ vars.OIDC_ISSUER }}")
          location=$(curl --silent --show-error -o /dev/null -w '%{http_code} %{redirect_url}' https://drive.everbright.it/oidc/login/)
          echo "EverID start: ${location%%\?*}"
          [[ "$location" == "302 $origin/application/o/authorize/?"* ]]
