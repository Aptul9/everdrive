name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tests and containers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIVE_DATA_DIR: /tmp/drive-ci-data
      DRIVE_ALLOWED_HOSTS: localhost,testserver
      DRIVE_INSECURE_LOCAL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Isolated test credentials
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name in ('DJANGO_SECRET_KEY', 'TEST_OWNER_PASSWORD'):
                  value = secrets.token_urlsafe(48)
                  print('::add-mask::' + value)
                  output.write(name + '=' + value + '\n')
          PY
      - name: Django and storage tests
        run: |
          mkdir -p "$DRIVE_DATA_DIR"
          python manage.py makemigrations --check --dry-run
          python manage.py test storage --verbosity 1
          DRIVE_INSECURE_LOCAL=0 python manage.py check --deploy --fail-level WARNING
          python -m unittest discover -s ci -p 'test_*.py'
      - name: Build and validate production containers
        run: |
          docker build -t everbright-drive:ci .
          docker build -f Dockerfile.caddy -t everbright-drive-web:ci .
          docker run --rm -e DOMAIN=drive.example.com everbright-drive-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose config --quiet
          mkdir -p /tmp/drive-ci-container
          chmod 777 /tmp/drive-ci-container
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp -e DJANGO_SECRET_KEY -e DRIVE_INSECURE_LOCAL=1 -v /tmp/drive-ci-container:/data everbright-drive:ci python manage.py migrate --noinput
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp -e DJANGO_SECRET_KEY -e DRIVE_INSECURE_LOCAL=1 -v /tmp/drive-ci-container:/data everbright-drive:ci python manage.py check
          options=(--cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp -e DJANGO_SECRET_KEY -e DRIVE_INSECURE_LOCAL=1 -e DRIVE_ALLOWED_HOSTS=localhost -e DRIVE_QUOTA_BYTES=67108864 -e DRIVE_ANONYMOUS_TTL_SECONDS=60 -v /tmp/drive-ci-container:/data)
          printf '%s\n' "$TEST_OWNER_PASSWORD" | docker run --rm -i "${options[@]}" everbright-drive:ci python manage.py bootstrap_owner
          container=$(docker run -d "${options[@]}" -p 127.0.0.1:8791:8000 everbright-drive:ci)
          cleaner=$(docker run -d "${options[@]}" everbright-drive:ci python manage.py cleanup --loop)
          trap 'docker rm -f "$container" "$cleaner" >/dev/null' EXIT
          printf '%s\n' "$TEST_OWNER_PASSWORD" | python ci/smoke.py --url http://localhost:8791
          printf '%s\n' "$TEST_OWNER_PASSWORD" | python ci/expiry_smoke.py --url http://localhost:8791 --data-dir /tmp/drive-ci-container
          bash -n ci/deploy.sh ci/rollback.sh

  deploy:
    name: Deploy
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://drive.everbright.it
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: SSH configuration
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Prepare release and runtime inputs
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          test -n "$DJANGO_SECRET_KEY" && test -n "$OWNER_PASSWORD"
          umask 077
          git archive --format=tar.gz HEAD > release.tar.gz
          printf 'DJANGO_SECRET_KEY=%s\n' "$DJANGO_SECRET_KEY" > environment.new
          printf '%s\n' "$OWNER_PASSWORD" > owner-password.new
          ssh "$TARGET" 'install -d -m 700 /opt/everbright-drive'
          scp release.tar.gz environment.new owner-password.new "$TARGET:/opt/everbright-drive/"
      - name: Deploy from versioned script
        run: ssh "$TARGET" "tar xOf /opt/everbright-drive/release.tar.gz ci/deploy.sh | bash -s -- '$GITHUB_SHA'"
      - name: Public application checks
        run: |
          curl --fail --silent --show-error https://drive.everbright.it/healthz/ | grep -q '"status": "ok"'
          curl --fail --silent --show-error https://drive.everbright.it/anonymous/ | grep -q 'Condivisioni'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://drive.everbright.it/api/files/)" = 401
